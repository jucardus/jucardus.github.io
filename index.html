<body>

    <iframe id="gas-iframe" src="" title="Repositorio Jucardus"></iframe>

    <script>
      (function() {
        var baseUrl = 'https://script.google.com/macros/s/AKfycbwbFdWWMFth-Li59IeqfWGWt7ly1lM8xGumv0w_sxCAUHUSTV-2bogT1mX9-odjJue3Yg/exec';
        var iframe = document.getElementById('gas-iframe');

        // 1. Leer el parámetro 'p' que dejó el 404.html
        var params = new URLSearchParams(window.location.search);
        var redirectPath = params.get('p');

        // 2. Construir la URL del iframe
        var iframeUrl = baseUrl;
        if (redirectPath) {
          // El path viene como "/Autor y contacto" (con la barra inicial)
          // Lo limpiamos y lo usamos como valor de 'q'
          var cleanPath = redirectPath.replace(/^\//, '');
          iframeUrl = baseUrl + '?q=' + encodeURIComponent(cleanPath);
        }

        // 3. Asignar el src al iframe
        iframe.src = iframeUrl;

        // 4. Opcional: limpiar la URL del navegador para que no se vea el ?p=...
        //    y quede como si el usuario hubiera entrado directamente a la ruta bonita.
        if (redirectPath) {
          window.history.replaceState(null, '', '/');
        }
      })();
    </script>
