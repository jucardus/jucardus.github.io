<body>

  <iframe id='mainFrame' src='https://script.google.com/macros/s/AKfycbwbSZ-ssJVdJ8ob8wOYW1z97yGhpOaEMnEZFbgCbqFeiEhZ-brWGk4czkTYXT_WrYWy7g/exec'/>

<script>
(function() {
    const baseUrl = "https://google.com";
    const iframe = document.getElementById('mainFrame');
    
    // 1. Capturar el query de forma inmediata y guardarlo en una constante fija
    const urlParams = new URLSearchParams(window.location.search);
    const queryValue = urlParams.get('q');
    
    // 2. Si el query existe y es válido, asignarlo al iframe primero
    if (queryValue && queryValue.trim().length >= 1) {
        const cleanQuery = queryValue.trim().replace(/[^a-zA-Z0-9-]/g, '');
        
        if (cleanQuery.length > 0) {
            // Modificamos el iframe inmediatamente usando el valor aislado
            iframe.src = baseUrl + "?q=" + encodeURIComponent(cleanQuery);
            
            // 3. Retrasamos la limpieza de la barra de navegación unos milisegundos 
            // para que no interfiera con el ciclo de renderizado inicial del navegador
            setTimeout(function() {
                const cleanUrl = window.location.protocol + "//" + window.location.host + "/";
                window.history.replaceState({}, document.title, cleanUrl);
            }, 100);
        }
    }
})();
</script>
