<body>
  <iframe id='mainFrame'></iframe>

<script>
(function() {
    const baseUrl = "https://script.google.com/macros/s/AKfycbzEo3-KoZ2afgj-bw2eT2TxYjYdsq1eTAfOm0Y4SmPm1VW-jD8WX59_quggtqz5j_E0Qg/exec";
    const iframe = document.getElementById('mainFrame');
    
    // Leer el query de la URL
    const urlParams = new URLSearchParams(window.location.search);
    let queryValue = urlParams.get('q');
    
    // Si hay query, cargar el iframe con el query
    if (queryValue && queryValue.trim().length >= 1) {
        const cleanQuery = queryValue.trim().replace(/[^a-zA-Z0-9-]/g, '');
        iframe.src = baseUrl + "?q=" + encodeURIComponent(cleanQuery);
        
        // Limpiar la URL para que no persista el query
        const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
        window.history.replaceState({}, document.title, cleanUrl);
    } else {
        // Si no hay query, cargar la página normal
        iframe.src = baseUrl;
    }
})();
</script>
