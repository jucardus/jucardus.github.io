<script>
(function() {
    const baseUrl = "https://script.google.com/macros/s/AKfycbwhBmhCb5f0FZSvQuoJAG-QJngLGTII-IQcdXN0nX_8qEyeyDnhq6fPf_kSaP4034sVrQ/exec";
    const iframe = document.getElementById('mainFrame');
    
    // Leer ?q= de la URL
    const urlParams = new URLSearchParams(window.location.search);
    let queryValue = urlParams.get('q');
    
    // Si hay query, enviarlo al iframe
    if (queryValue && queryValue.trim().length >= 1) {
        const cleanQuery = queryValue.trim().replace(/[^a-zA-Z0-9-]/g, '');
        iframe.src = baseUrl + "?q=" + encodeURIComponent(cleanQuery);
    }
})();
</script>
