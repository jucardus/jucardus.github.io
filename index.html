  <iframe id='mainFrame' src='https://script.google.com/macros/s/AKfycbyLQKRpE5xV9RMjIWdUsDrYCCB37SxrmNvMWMDTXXz6CXqQp256gn4ylUkfNL_UYen8lw/exec'/>

<script>
    (function() {
        // Base URL of your Google Apps Script
        const baseUrl = &quot;https://script.google.com/macros/s/AKfycbyLQKRpE5xV9RMjIWdUsDrYCCB37SxrmNvMWMDTXXz6CXqQp256gn4ylUkfNL_UYen8lw/exec&quot;;
        
        const iframe = document.getElementById(&#39;mainFrame&#39;);
        
        // PRIMERO: Revisar si hay ?q= en la URL
        const urlParams = new URLSearchParams(window.location.search);
        let queryValue = urlParams.get(&#39;q&#39;);
        let isPathQuery = false;
        
        // SEGUNDO: Si no hay ?q=, revisar el path de la URL
        // Ejemplo: jucardus.github.com/123456789012
        if (!queryValue || queryValue.trim().length &lt; 1) {
            const path = window.location.pathname;
            const pathSegments = path.split(&#39;/&#39;).filter(segment =&gt; segment.length &gt; 0);
            if (pathSegments.length &gt; 0) {
                queryValue = pathSegments[0];
                isPathQuery = true; // Recordamos que vino del path
            }
        }
        
        // Si encontramos un query, actualizar el iframe
        if (queryValue &amp;&amp; queryValue.trim().length &gt;= 1) {
            iframe.src = baseUrl + &quot;?q=&quot; + encodeURIComponent(queryValue);
            
            // Limpiar la URL del navegador
            // Si vino del path, limpiamos completamente a la raíz
            // Si vino de ?q=, solo quitamos el parámetro
            if (isPathQuery) {
                // Para queries del path, volvemos a la raíz del sitio
                const cleanUrl = window.location.protocol + &quot;//&quot; + window.location.host;
                window.history.replaceState({}, document.title, cleanUrl);
            } else {
                // Para queries con ?q=, solo quitamos el parámetro
                const cleanUrl = window.location.protocol + &quot;//&quot; + window.location.host + window.location.pathname;
                window.history.replaceState({}, document.title, cleanUrl);
            }
        }
    })();
</script>
