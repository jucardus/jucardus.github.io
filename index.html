<script>
(function() {
    // Base URL de tu Google Apps Script
    const baseUrl = "https://script.google.com/macros/s/AKfycbxVbk8j8Ii_xEd7_ZgNNoUtrO3Aa9z8L8aLtDPGSZddQV9sWrxO1CRhKKhi_7--rcq_GA/exec";
    const iframe = document.getElementById('mainFrame');
    
    // 1. Revisar si hay ?q= en la URL
    const urlParams = new URLSearchParams(window.location.search);
    let queryValue = urlParams.get('q');
    let isPathQuery = false;
    
    // 2. Si no hay ?q=, revisar la ruta limpia de la URL
    if (!queryValue || queryValue.trim().length < 1) {
        const path = window.location.pathname;
        const pathSegments = path.split('/').filter(segment => segment.length > 0 && segment !== 'index.html');
        if (pathSegments.length > 0) {
            queryValue = pathSegments[pathSegments.length - 1];
            isPathQuery = true; 
        }
    }
    
    // 3. Si encontramos un código, actualizar el iframe y limpiar la barra
    if (queryValue && queryValue.trim().length >= 1) {
        // Asignamos el query al iframe de forma idéntica a como lo hacías en Blogspot
        iframe.src = baseUrl + "?q=" + encodeURIComponent(queryValue.trim());
        
        // CORRECCIÓN PARA GITHUB: Limpiamos la URL respetando la ruta exacta de la web
        const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
        window.history.replaceState({}, document.title, cleanUrl);
    }
})();
</script>
