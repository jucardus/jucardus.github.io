<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirigiendo...</title>
  <script>
    // Captura la ruta que el usuario intentó acceder (ej. "/Autor y contacto")
    var path = window.location.pathname;
    var search = window.location.search;

    // Validación de seguridad: solo rutas relativas
    if (path && path.startsWith('/') && !path.startsWith('//') && !path.includes('://')) {
      // Redirige a la raíz con la ruta codificada como parámetro
      window.location.replace(window.location.origin + '/?p=' + encodeURIComponent(path + search));
    } else {
      // Si la ruta es inválida, redirige a la raíz sin parámetros
      window.location.replace(window.location.origin);
    }
  </script>
</head>
<body>
  <p>Redirigiendo...</p>
</body>
</html>
