<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Jucardus.com</title>
</head>
<body>
  <script>
    (function() {
      // 1) Extraer la ruta de window.location.pathname
      var path = window.location.pathname || '';
      path = path.replace(/^\/+/, '');          // quitar "/" iniciales
      path = path.replace(/^404\.html$/i, '');   // por si acaso
      path = path.replace(/\/+$/, '');           // quitar "/" finales
      try { path = decodeURIComponent(path); } catch (e) {}

      // 2) Redirigir a /?q=<ruta codificada>
      //    Usamos encodeURIComponent para que la ruta viaje como un
      //    único parámetro (los "/" se codifican como %2F, que es lo
      //    que espera el ?q=).
      if (path) {
        window.location.replace(
          window.location.origin + '/?q=' + encodeURIComponent(path)
        );
      } else {
        window.location.replace(window.location.origin + '/');
      }
    })();
  </script>
</body>
</html>
